// Read filter from URL query param
const urlFilter = new URLSearchParams(window.location.search).get('filter') || 'all';

function renderCards(filter) {
  const grid = document.getElementById('blog-grid');
  const filtered = filter === 'all' ? posts : posts.filter(p => p.tags.includes(filter));
  document.getElementById('post-count').textContent = filtered.length;

  grid.innerHTML = filtered.map((post, i) => `
    <a class="blog-card${post.featured ? ' featured' : ''}" href="posts/${post.slug}.html" style="animation-delay:${i * 0.05}s">
      <div class="card-thumb">${post.thumb}</div>
      <div class="card-body">
        <p class="card-date">${post.date}</p>
        <h2 class="card-title">${post.title}</h2>
        <p class="card-author">By ${post.author}</p>
        <p class="card-excerpt">${post.excerpt}</p>
        <div class="card-tags">
          ${post.tagLabels.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    </a>
  `).join('');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  const f = btn.dataset.filter;
  if (f === urlFilter) btn.classList.add('active');
  else btn.classList.remove('active');

  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(f);
    // Update URL without reload
    const url = f === 'all' ? window.location.pathname : `?filter=${f}`;
    window.history.pushState({}, '', url);
  });
});

// Header tag active state
document.querySelectorAll('.header-tag').forEach(tag => {
  const href = tag.getAttribute('href');
  const tagFilter = href.includes('filter=') ? href.split('filter=')[1] : 'all';
  tag.classList.toggle('active', tagFilter === urlFilter);
});

renderCards(urlFilter);
