<style>

  :root {
    --bg: #0c0c0c;
    --bg-card: #111111;
    --bg-hover: #161616;
    --border: #222222;
    --border-light: #1a1a1a;
    --text: #f0ede8;
    --text-muted: #666;
    --text-dim: #444;
    --accent: #e8541a;
    --accent-hover: #ff6b30;
    --tag-border: #2a2a2a;
    --tag-text: #777;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;

  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    border-bottom: 1px solid var(--border);

    top: 0;
    background: rgba(12,12,12,0.92);

    z-index: 100;
  }

  .site-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
  }

  .logo-mark {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    width: 24px;
    height: 24px;
  }

  .logo-mark span {
    border-radius: 2px;
    display: block;
  }
  .logo-mark span:nth-child(1) { background: #FF7262; border-radius: 3px 3px 3px 3px; }
  .logo-mark span:nth-child(2) { background: #A259FF; border-radius: 50%; }
  .logo-mark span:nth-child(3) { background: #0ACF83; border-radius: 50%; }
  .logo-mark span:nth-child(4) { background: #1ABCFE; border-radius: 3px; }

  .logo-text {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .logo-text em {
    font-style: normal;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 4px;
  }

  .header-tags {
    display: flex;
    gap: 6px;
  }

  .header-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 5px 12px;
    border: 1px solid var(--tag-border);
    border-radius: 100px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    font-family: inherit;
  }

  .header-tag:hover, .header-tag.active {
    color: var(--text);
    border-color: #444;
  }

  .hero {
    padding: 72px 48px 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  .hero-left {}

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;

  .hero-eyebrow::before {

    align-items: center;
    gap: 8px;

    letter-spacing: 0.08em;
    text-transform: uppercase;

  .blog-card.featured::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid var(--accent);
    pointer-events: none;
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
  }

  .card-thumb svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: transform 0.4s ease;
  }

  .blog-card:hover .card-thumb svg {
    transform: scale(1.03);
  }

  .card-body {
    padding: 22px 26px 26px;
  }

  .card-date {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .card-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.2;
    color: var(--text);
    margin-bottom: 10px;
  }

  .card-author {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 11px;
  }

  .card-excerpt {
    font-size: 13px;
    color: var(--text-muted);

    margin-bottom: 18px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--tag-border);
    color: var(--tag-text);
    padding: 4px 10px;
    border-radius: 100px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    margin-bottom: 48px;
    transition: color 0.15s;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }

  .back-btn:hover { color: var(--text); }

  .back-btn svg {
    width: 16px;
    height: 16px;

    gap: 8px;
    margin-bottom: 24px;

  .article-hero-thumb svg {

    height: 100%;

  }

    font-size: 46px;
    font-weight: 400;
    letter-spacing: -0.025em;

    height: 36px;
    border-radius: 50%;

    align-items: center;

    height: 32px;

  .meta-info {

  .article-body h2 {

    font-weight: 800;

  .article-body h3 {

    font-size: 17px;
    font-weight: 700;

    font-size: 13px;
    background: #161616;
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    color: #a8c4a0;

  .article-body pre {
    background: #0f0f0f;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    overflow-x: auto;
    margin: 1.5em 0;
  }

  .article-body pre code {

    border: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #c8c4be;

  .article-body blockquote {
    border-left: 2px solid var(--accent);
    padding-left: 20px;
    margin: 2em 0;
    color: var(--text-muted);
    font-style: italic;

  .article-body li { margin-bottom: 0.5em; }

  .article-body a { color: var(--accent); text-decoration: none; }

  .reading-time {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* MORE POSTS */
  .more-posts {
    border-top: 1px solid var(--border);
    padding: 64px 48px;
  }

  .more-posts-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .more-posts-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .more-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }

  /* FOOTER */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 28px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-copy {
    font-size: 12px;
    color: var(--text-dim);

  .footer-links {

      <p>At our company, every code change that lands on a release branch must be trustworthy — not just from a code quality perspective, but from a device and identity perspective too. This post walks through how we built a system to enforce that trust at the commit level.</p>

      <h2>The problem with unsigned commits</h2>
      <p>By default, Git doesn't verify who actually authored a commit. Anyone with push access to a repository can set their git config to any name and email they want — including yours. For most development workflows, this isn't a concern. But on high-value branches like <code>main</code> and <code>release/*</code>, we need stronger guarantees.</p>
      <p>We wanted to ensure that every commit on a protected branch was:</p>
      <ul>
        <li>Made by a verified employee identity (not just a shared service account)</li>
        <li>Signed from a managed, trusted device</li>
        <li>Tamper-evident after the fact</li>
      </ul>

      <h2>Commit signatures with GPG</h2>
      <p>Git supports commit signing with GPG keys out of the box. When you run <code>git commit -S</code>, Git will sign the commit with your configured GPG key. GitHub renders a "Verified" badge on signed commits when the key is associated with your account.</p>
      <p>This gives us tamper-evidence, but it doesn't directly tie the commit to a managed device. A developer could sign a commit from their personal laptop. We needed to go a step further.</p>

      <h2>Okta Device Trust as a signing root</h2>
      <p>The key insight was using Okta Device Trust certificates as the root of trust for commit signing. When a device enrolls in our MDM, Okta issues a device certificate. We wrote a small helper that:</p>
      <ol>
        <li>Verifies the Okta device certificate is present and valid</li>
        <li>Derives a per-developer GPG key, cosigned by the device cert</li>
        <li>Registers that key with GitHub automatically</li>
      </ol>

      <pre><code># Check device cert presence before allowing commit
#!/bin/bash
security find-certificate -c "Okta Device Trust" \
  -a /Library/Keychains/System.keychain > /dev/null 2>&1
if [ $? -ne 0 ]; then
  echo "ERROR: No valid device trust certificate found."
  echo "Please enroll your device before committing."
  exit 1
fi</code></pre>

      <h2>GitHub branch protection rules</h2>
      <p>With signing in place, we enabled branch protection rules on all release branches to require signed commits. GitHub will reject any push that contains unsigned commits, giving us a hard enforcement point even if a developer's local hooks are bypassed.</p>

      <blockquote>Enforce at the boundary, not just at the source. Local hooks can be skipped. Server-side rules cannot.</blockquote>

      <h2>The developer experience</h2>
      <p>The biggest risk with security controls is that they slow developers down and get bypassed. We put significant effort into making this seamless: onboarding is fully automated, re-enrollment triggers automatically on device changes, and the error messages are specific enough that developers can self-serve most issues.</p>
      <p>After six months of running this in production, we've had zero bypass incidents and the p99 overhead for a commit operation is under 80ms. We consider that a success.</p>

      <h2>What's next</h2>
      <p>We're currently exploring extending this to CI/CD pipeline steps, so that not just human commits but also automated commits from our release tooling carry the same device trust guarantees. Watch this space.</p>

    content: `
      <p>When you run untrusted code — whether it's user-submitted plugins, third-party integrations, or even your own services that handle hostile inputs — you need to think carefully about what that code can actually <em>do</em> on your system. Containers and seccomp are two primitives that, when combined, give you meaningful isolation without the overhead of full virtual machines.</p>

      <h2>Why not just use VMs?</h2>
      <p>Virtual machines give you strong isolation by emulating separate hardware, but they come with real costs: slow startup times (seconds, not milliseconds), significant memory overhead per instance, and operational complexity around image management and orchestration.</p>
      <p>For many workloads — particularly those that need to spin up and tear down rapidly — these costs are prohibitive. Containers and seccomp let you get most of the security benefit at a fraction of the cost.</p>

      <h2>Container isolation fundamentals</h2>
      <p>Linux containers aren't a single thing — they're a combination of kernel features working together:</p>
      <ul>
        <li><strong>Namespaces</strong> isolate the container's view of system resources (PID space, network, filesystem mounts, etc.)</li>
        <li><strong>cgroups</strong> limit resource consumption (CPU, memory, I/O)</li>
        <li><strong>Capabilities</strong> restrict what privileged operations the container can perform</li>
      </ul>
      <p>By default, containers still share the host kernel. This is both what makes them fast and what makes them less isolated than VMs.</p>

      <h2>Enter seccomp</h2>
      <p>Seccomp (secure computing mode) is a Linux kernel feature that lets you restrict which system calls a process can make. A seccomp profile is essentially a filter that says: "this process is allowed to call <code>read</code>, <code>write</code>, <code>open</code>… but not <code>ptrace</code>, <code>mount</code>, or <code>kexec_load</code>."</p>

      <blockquote>Seccomp doesn't just reduce the attack surface — it redefines it. Instead of defending against exploitation of any syscall, you only need to worry about the small set you've explicitly permitted.</blockquote>

      <pre><code>{
  "defaultAction": "SCMP_ACT_ERRNO",
  "syscalls": [
    {
      "names": ["read", "write", "open", "close",
                "stat", "fstat", "mmap", "mprotect",
                "exit_group", "futex", "brk"],
      "action": "SCMP_ACT_ALLOW"
    }
  ]
}</code></pre>

      <h2>Building a minimal allowlist</h2>
      <p>The hardest part of seccomp is figuring out which syscalls your application actually needs. We use <code>strace</code> in audit mode to record every syscall made during integration tests, then build an allowlist from that. This process surfaced some surprising dependencies — glibc's <code>malloc</code> implementation, for instance, occasionally calls <code>madvise</code>, which you'd never know to include without tracing.</p>

      <h2>Defense in depth</h2>
      <p>Neither containers nor seccomp are silver bullets. A misconfigured container with excessive capabilities can still be dangerous. A seccomp profile that's too permissive provides little protection. The value comes from layering these controls: namespace isolation limits blast radius, capability dropping removes common privilege escalation vectors, and seccomp blocks kernel attack surface.</p>
      <p>In part three of this series, we'll look at gVisor and how it pushes this isolation further by intercepting system calls entirely.</p>
    `

    content: `
      <p>Sandboxing is one of those security techniques that sounds simple in theory — put untrusted code in a box — but turns out to be surprisingly nuanced in practice. This three-part series documents what we learned deploying sandboxing for server-side workloads at scale.</p>

      <h2>What are we protecting against?</h2>
      <p>Before choosing a sandboxing approach, it's worth being precise about your threat model. For us, the primary concerns were:</p>
      <ul>
        <li><strong>Confused deputy attacks</strong> — a compromised service making requests it shouldn't be able to make</li>
        <li><strong>Lateral movement</strong> — an attacker who compromises one service moving to others on the same host</li>
        <li><strong>Data exfiltration</strong> — a compromised process reading secrets it wasn't intended to access</li>
      </ul>
      <p>We were less concerned about local privilege escalation (our hosts are ephemeral and single-tenant) or denial of service (we have separate resource limits for that).</p>

      <h2>The sandboxing landscape</h2>
      <p>There's a spectrum of sandboxing approaches, roughly ordered by isolation strength and performance cost:</p>
      <ul>
        <li><strong>seccomp + capabilities</strong> — lightweight, kernel-enforced syscall filtering</li>
        <li><strong>Linux namespaces</strong> — process, network, and filesystem isolation</li>
        <li><strong>gVisor</strong> — user-space kernel that intercepts syscalls entirely</li>
        <li><strong>Firecracker/VMs</strong> — full hardware virtualization</li>
      </ul>
      <p>We ended up using different points on this spectrum for different workloads, based on their performance sensitivity and risk profile.</p>

      <h2>Why this matters more than ever</h2>
      <p>Modern applications are increasingly polyglot and plugin-based. Whether it's a Figma plugin running in a sandboxed iframe, a CI system executing user-submitted scripts, or an AI model executing generated code — the pattern of running untrusted code is everywhere.</p>
      <p>Getting sandboxing right isn't optional anymore. The question is just how much isolation you need and how much you're willing to pay for it.</p>

      <blockquote>The best sandbox is one you forget is there — invisible to developers until the day it actually matters.</blockquote>

      <p>In part two, we'll dive deep into containers and seccomp, including the specific profiles we use and the tooling we built to generate and maintain them. In part three, we'll cover gVisor and when the additional isolation overhead is worth it.</p>

      <p>Traditional network security assumed a hard perimeter: everything inside the network was trusted, everything outside was not. Zero-trust flips this model on its head — no implicit trust based on network location, every request must be authenticated and authorized regardless of where it originates.</p>

      <h2>Why we needed to change</h2>
      <p>Our old VPN-based model was showing its age. Developers complained about performance. The blast radius from a single compromised credential was enormous. And as we moved more workloads to cloud environments, the concept of a "corporate network" had become increasingly theoretical.</p>

      <h2>The architecture we landed on</h2>
      <p>Our zero-trust implementation has three core pillars:</p>
      <ul>
        <li><strong>Identity-aware proxies</strong> — every internal service sits behind a proxy that enforces authentication</li>
        <li><strong>Short-lived credentials</strong> — no long-lived service account keys, everything uses SPIFFE/SPIRE workload identity</li>
        <li><strong>Continuous verification</strong> — device posture is checked on every request, not just at VPN connect time</li>
      </ul>

      <blockquote>Assume breach. Then build systems where a breach of one component doesn't automatically become a breach of everything.</blockquote>

      <h2>The hardest part: legacy services</h2>
      <p>New services were easy — we wrote the identity-aware proxy support into our standard service template and it came for free. The hard part was the long tail of legacy services that assumed they could talk to anything on the internal network without authentication.</p>
      <p>We built a compatibility shim that translated mTLS workload identity into the Basic Auth credentials those services expected, giving us a migration path that didn't require simultaneous rewrites of everything.</p>

      <h2>Measuring success</h2>
      <p>One year in, our mean time to detect lateral movement attempts has dropped from days to minutes. Developer experience has actually improved — the identity-aware proxy handles SSO transparently, so developers no longer have to think about which internal tool requires which VPN split tunnel.</p>
    `

      <p>When your engineering org is small, having a security person review every pull request is feasible. When you're at hundreds of engineers shipping code daily, it isn't. This post describes how we built automated static analysis tooling to scale our security review capacity without scaling our security team linearly.</p>

      <h2>The problem with manual review</h2>
      <p>Manual security review is slow, inconsistent, and doesn't scale. More importantly, it creates a bottleneck that incentivizes engineers to work around the process. We wanted security to be something that happened automatically and invisibly, not a gate that engineers dreaded.</p>

      <h2>Choosing what to automate</h2>
      <p>Not all security issues are amenable to static analysis. SQL injection, for example, requires understanding your data flow from user input to database query. XSS requires understanding how user-controlled strings reach the DOM. These are tractable for static analysis. But business logic vulnerabilities — "this user shouldn't be able to see another user's data" — require domain knowledge that's very hard to encode in a tool.</p>
      <p>We focused first on the vulnerability classes with high precision (low false positive rate) and high prevalence:</p>
      <ul>
        <li>Hardcoded credentials and secret material in code</li>
        <li>Unsafe deserialization patterns</li>
        <li>Known-vulnerable dependency versions</li>
        <li>Common cryptographic misuse patterns</li>
      </ul>

      <h2>The toolchain</h2>
      <p>We built on top of Semgrep for pattern-based analysis and added custom rules for our internal frameworks. The critical design decision was integrating directly into the CI pipeline with a fail-open stance: if the analyzer crashes or takes too long, the build continues. We never want security tooling to be a reliability risk for shipping.</p>

      <pre><code># .semgrep.yml — example custom rule
rules:
  - id: no-raw-sql-interpolation
    patterns:
      - pattern: db.query("..." % ...)
      - pattern: db.query("..." + ...)
    message: "SQL query built with string interpolation. Use parameterized queries."
    severity: ERROR
    languages: [python]</code></pre>

      <h2>Fighting alert fatigue</h2>
      <p>The biggest failure mode for static analysis is too many false positives — developers start ignoring all alerts, including real ones. We invested heavily in tuning our rules to achieve greater than 90% precision before rolling them out. A rule that fires on 10 real issues and 100 false positives is worse than no rule at all.</p>

      <blockquote>A security tool that developers learn to ignore is a liability, not an asset. Precision matters more than recall.</blockquote>

      <h2>Results</h2>
      <p>After 12 months, our automated tooling catches around 60% of the security issues that would have previously required manual review. Our security team now focuses human attention on the harder, context-dependent issues that can't be automated — which, it turns out, is a much more interesting use of their time.</p>
    `

      <p>One year ago, we launched our public bug bounty program. We weren't sure what to expect — would we be flooded with noise? Would researchers find things we'd missed? Would our triage capacity hold up?</p>
      <p>The short answer: yes to all three, in different proportions than we anticipated.</p>

      <h2>The numbers</h2>
      <p>In our first year we received 847 reports. Of those:</p>
      <ul>
        <li>312 were valid, in-scope vulnerability reports</li>
        <li>278 were informational or out-of-scope</li>
        <li>257 were duplicates or NA (not applicable)</li>
      </ul>
      <p>We paid out $580,000 in bounties across 312 valid reports, with an average payout of $1,859 and a maximum single payout of $45,000 for a critical authentication bypass.</p>

      <h2>What surprised us</h2>
      <p>We expected most reports to be low-severity. We were wrong — a meaningful fraction of reports were high or critical severity, finding real vulnerabilities in production systems that our internal security reviews had missed. This was humbling, and validating at the same time.</p>
      <p>The quality distribution was highly skewed. Our top 10 researchers submitted over 40% of valid reports. Building relationships with those researchers turned out to be as valuable as the program itself.</p>

      <blockquote>Bug bounty isn't just about finding vulnerabilities. It's about building a relationship with the security community. The researchers who trust you enough to responsibly disclose are an asset.</blockquote>

      <h2>Triage at scale</h2>
      <p>The operational challenge we underestimated was triage. Processing 847 reports a year — about 70 per month — requires a dedicated workflow. We built internal tooling to route reports by product area, deduplicate against our existing backlog, and track SLA compliance for initial response (we target 24 hours).</p>

      <h2>What we'd do differently</h2>
      <p>We'd define scope more precisely from day one. Vague scope language leads to arguments with researchers about whether something is in scope, which creates bad experiences on both sides. We'd also invest in the researcher relationship earlier — proactively reaching out to top reporters, offering retesting access, and publishing more about what we fixed.</p>

      <h2>Year two plans</h2>
      <p>We're expanding scope to include some internal tooling, increasing maximum payouts for critical vulnerabilities, and launching a live hacking event with our top researchers. The program has more than paid for itself — not just in vulnerabilities found, but in the security culture shift of treating external researchers as collaborators rather than adversaries.</p>

let currentFilter = 'all';

function renderCards(postsToRender) {
  const grid = document.getElementById('blog-grid');
  grid.innerHTML = '';
  postsToRender.forEach((post, i) => {
    const card = document.createElement('div');
    card.className = 'blog-card' + (post.featured ? ' featured' : '');
    card.style.animationDelay = (i * 0.05) + 's';
    card.innerHTML = `
      <div class="card-thumb">${post.thumb}</div>
      <div class="card-body">
        <p class="card-date">${post.date}</p>
        <h2 class="card-title">${post.title}</h2>
        <p class="card-author">By ${post.author}</p>
        <p class="card-excerpt">${post.excerpt}</p>
        <div class="card-tags">
          ${post.tagLabels.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    `;
    card.addEventListener('click', () => showArticle(post));
    grid.appendChild(card);
  });
  document.getElementById('post-count').textContent = postsToRender.length;
}

function filterPosts(filter, btn) {
  currentFilter = filter;

  // Update all filter buttons (both header and filter bar)
  document.querySelectorAll('.filter-btn, .header-tag').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn, .header-tag').forEach(b => {
    const btnFilter = b.getAttribute('onclick')?.match(/filterPosts\('(\w+)'/)?.[1];
    if (btnFilter === filter) b.classList.add('active');
  });

  const filtered = filter === 'all' ? posts : posts.filter(p => p.tags.includes(filter));
  renderCards(filtered);
}

            <div class="blog-card" onclick="showArticleById(${p.id})" style="cursor:pointer">

function showArticleById(id) {

function showListing() {
